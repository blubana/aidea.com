[project]
name = "aidea-com"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.7.0",
    "numpy>=2.4.6",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "tqdm>=4.67.0",
    "rich>=13.9.0",
    "seaborn>=0.13.0",
    "lightgbm>=4.6.0",
    "catboost>=1.2.10",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
